server:
  port: 8081

spring:
  application:
    name: ai-cs-backend
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

ai:
  fastapi:
    base-url: http://localhost:8000
    internal-api-key: dev-internal-key
    timeout-seconds: 30